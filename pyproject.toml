[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openeurollm-post-training-eval"
version = "0.1.0"
description = "Capability-driven evaluation and release gates for OpenEuroLLM post-training checkpoints"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "OpenEuroLLM contributors"}]
dependencies = []

[project.scripts]
pteval = "post_training_eval.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

