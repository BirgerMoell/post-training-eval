name: Validate registry

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m post_training_eval.cli validate
      - run: python -m unittest discover -s tests -v
      - run: python -m post_training_eval.cli site
      - name: Generated site data must be committed
        run: git diff --exit-code docs/data/index.json

